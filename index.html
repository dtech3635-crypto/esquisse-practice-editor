<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エスキス練習エディター｜建築士試験対策</title><meta name="description" content="課題・採点・比較機能を備えた建築士試験エスキス学習ツール"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="learning.css"><link rel="stylesheet" href="multiselect.css"></head>
<style>.orient-control{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#eef2ee;border:1px solid #cbd0cc;border-radius:6px;padding:6px 8px;margin-bottom:8px;font-size:12px}.orient-control button{padding:5px 9px;white-space:nowrap}.selection-card label{display:grid;gap:5px}.selection-card input{width:100%;padding:7px;border:1px solid #cbd0cc;border-radius:5px}.resize-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.resize-buttons button{color:var(--ink);padding:6px}.resize-handle{position:absolute;z-index:5;background:#fff;border:2px solid #26302f;border-radius:3px;width:13px;height:13px;box-shadow:0 1px 3px #0004}.resize-handle.corner{right:-7px;bottom:-7px;cursor:nwse-resize}.grid{overflow:visible}.grid-wrap{margin:60px 75px 68px 52px}.site-notch{position:absolute;display:block;background:repeating-linear-gradient(45deg,#00000010,#00000010 8px,#0000 8px,#0000 16px);pointer-events:none;z-index:1}.site-notch span{position:absolute;left:6px;top:5px;font-style:normal;font-size:10px;color:#7d827e;white-space:nowrap}.column-marker{position:absolute;width:9px;height:9px;background:#3c4744;border:1px solid #fffffb;border-radius:1px;transform:translate(-50%,-50%);pointer-events:none;z-index:5}.column-marker.conflict{background:#d32f2f;width:11px;height:11px;box-shadow:0 0 0 2px #d32f2f55}.piece.drafting{z-index:3}</style>
<style>.context-menu{position:fixed;z-index:100;background:#fff;border:1px solid #bfc6c1;border-radius:7px;box-shadow:0 5px 18px #0003;padding:5px;min-width:130px}.context-menu button{display:block;width:100%;border:0;text-align:left;padding:8px 12px}.context-menu button:hover{background:#edf1eb}.context-menu span{display:block;padding:8px;color:#737d79;font-size:12px}</style>
<style>.piece.drafting-free-line{z-index:4;background:transparent!important;border:0;border-top:3px solid #d32f2f;color:#d32f2f;text-shadow:none;overflow:visible;transform:rotate(var(--arrow-angle,0deg));transform-origin:center center}.piece.drafting-free-line>span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-size:10px}.piece.drafting-free-line .resize-handle{top:-8px;bottom:auto}.piece.drafting-free-frame{z-index:4;background:transparent!important;border:3px solid #d32f2f;color:#d32f2f;text-shadow:none}.piece.drafting-free-frame>span{background:#fff;padding:2px 4px;line-height:1.25}.selection-card input[type=range]{width:100%}</style>
<body><div id="context-menu" class="context-menu" hidden></div><header><div><span class="mark">□</span><b>エスキス練習エディター</b><small>課題を解いて、自動採点するエスキスツール</small></div><nav><button id="open-problem">課題条件</button><button id="grade-plan">採点する</button><button id="save-scheme">案を保存</button><button id="compare-schemes">案を比較</button><button id="undo">↶ 元に戻す</button><button id="clear">配置クリア</button><button id="all-clear">オールクリア</button><button class="primary" id="save">画像保存</button></nav></header>
<section id="study-strip" class="study-strip"><div class="study-strip-head"><div class="study-strip-lead"><b id="active-problem-title">課題を読み込み中</b><span id="active-problem-brief"></span></div><div id="study-progress"></div></div><div id="study-requirements" class="study-requirements"></div></section>
<div id="learning-drawer" class="learning-drawer" hidden><div class="drawer-head"><div><span class="eyebrow">ESQUISSE PRACTICE EDITOR</span><h2 id="drawer-title">課題条件</h2></div><button id="close-drawer" aria-label="閉じる">×</button></div><div id="drawer-content"></div></div><div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
<main><aside class="palette"><div class="panel-title"><span>室構成</span><button id="reset">初期値</button></div><p class="hint">部屋を選び、グリッドをクリックして配置</p><div id="orient-control" class="orient-control" hidden><span>配置の向き：<b id="orient-name"></b> <b id="orient-size"></b></span><button id="orient-rotate">↻ 90°回転</button></div><div id="rooms"></div><div class="legend"><b>使い方</b><span>クリック：配置・選択</span><span>ドラッグ：移動</span><span>右クリック：コピー・削除</span></div></aside>
<section class="workspace"><div class="sheet-head"><div><b>ゾーニングシート</b><span id="summary">配置 0 / 14 コマ</span></div><label><input id="areas" type="checkbox" checked> 面積を表示</label></div><div id="floors"></div></section>
<aside class="settings"><h2>選択中の要素</h2><div id="selection" class="empty">要素を選択してください</div><hr><button id="quick-grade" class="grade-wide">現在案を採点</button></aside></main><div id="toast"></div><script src="app.js"></script><script src="learning.js"></script><script src="staging.js"></script></body></html>
